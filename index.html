<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine IP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0e13;
    --bg-panel: #101720;
    --line: #1d2733;
    --text: #dfe7ee;
    --muted: #6b7d8f;
    --accent: #4fe0c8;
    --accent-dim: rgba(79, 224, 200, 0.15);
    --warn: #f5a623;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 32px 32px;
    overflow: hidden;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-dim);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79, 224, 200, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(79, 224, 200, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 224, 200, 0); }
  }

  .scan-wrap {
    position: relative;
    margin: 32px 0 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border: 1px solid var(--accent-dim);
    border-radius: 50%;
    opacity: 0;
    animation: ripple 2.4s ease-out infinite;
  }
  .ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
  .ring:nth-child(2) { width: 100%; height: 100%; animation-delay: 0.8s; }
  .ring:nth-child(3) { width: 100%; height: 100%; animation-delay: 1.6s; }

  @keyframes ripple {
    0% { transform: scale(0.4); opacity: 0.5; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .ip-display {
    position: relative;
    z-index: 2;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 40px);
    letter-spacing: 0.02em;
    color: var(--accent);
    text-align: center;
    padding: 22px 18px;
    min-width: 260px;
    word-break: break-word;
  }

  .ip-display.loading {
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.06em;
  }

  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 8px;
  }

  .field {
    background: var(--bg-panel);
    padding: 14px 16px;
  }

  .field .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field .value {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .field .value.dim { color: var(--muted); font-weight: 400; }

  .footnote {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    text-align: center;
  }

  .refresh {
    display: block;
    margin: 20px auto 0;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .error {
    color: var(--warn);
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span>Netzwerk-Scan</div>

    <div class="scan-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ip-display loading" id="ipDisplay">Adresse wird ermittelt…</div>
    </div>

    <div class="details" id="details" style="display:none;">
      <div class="field">
        <div class="label">Stadt</div>
        <div class="value" id="city">—</div>
      </div>
      <div class="field">
        <div class="label">Region</div>
        <div class="value" id="region">—</div>
      </div>
      <div class="field">
        <div class="label">Land</div>
        <div class="value" id="country">—</div>
      </div>
      <div class="field">
        <div class="label">Anbieter</div>
        <div class="value dim" id="isp">—</div>
      </div>
    </div>

    <div class="error" id="errorMsg" style="display:none;"></div>

    <button class="refresh" id="refreshBtn">Neu abfragen</button>

    <p class="footnote">Diese Adresse sieht jede Website, die du besuchst.<br>Sie verrät ungefähren Standort und Internetanbieter, keine genaue Adresse.</p>
  </div>

<script>
  const ipDisplay = document.getElementById('ipDisplay');
  const details = document.getElementById('details');
  const errorMsg = document.getElementById('errorMsg');
  const refreshBtn = document.getElementById('refreshBtn');

  async function loadIP() {
    ipDisplay.textContent = 'Adresse wird ermittelt…';
    ipDisplay.classList.add('loading');
    details.style.display = 'none';
    errorMsg.style.display = 'none';

    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      if (!ipRes.ok) throw new Error('IP request failed');
      const ipData = await ipRes.json();

      ipDisplay.textContent = ipData.ip;
      ipDisplay.classList.remove('loading');

      try {
        const geoRes = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
        if (!geoRes.ok) throw new Error('Geo request failed');
        const geo = await geoRes.json();

        document.getElementById('city').textContent = geo.city || '—';
        document.getElementById('region').textContent = geo.region || '—';
        document.getElementById('country').textContent = geo.country_name || '—';
        document.getElementById('isp').textContent = geo.org || '—';
        details.style.display = 'grid';
      } catch (geoErr) {
        details.style.display = 'none';
      }
    } catch (err) {
      ipDisplay.textContent = '—';
      ipDisplay.classList.remove('loading');
      errorMsg.textContent = 'Adresse konnte nicht ermittelt werden. Bitte erneut versuchen.';
      errorMsg.style.display = 'block';
    }
  }

  refreshBtn.addEventListener('click', loadIP);
  loadIP();
</script>

</body>
</html>
